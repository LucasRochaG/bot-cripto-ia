name: Executar Bot Crypto IA

on:
  schedule:
    # Roda a cada 20 minutos
    - cron: '0,20,40 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  executar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python no Servidor
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install ccxt xgboost pandas numpy

      - name: Executar Varredura e Negociação Automática
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
        run: |
          python bot_top20.py

      - name: Salvar Histórico no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historico_sinais.csv || true
          git commit -m "update: historico de sinais salvo pela IA" || true
          git push || true
