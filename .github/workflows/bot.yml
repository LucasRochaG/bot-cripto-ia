name: Executar Bot Crypto IA

on:
  schedule:
    # Roda a cada 20 minutos (nos minutos 0, 20 e 40 de cada hora)
    - cron: '0,20,40 * * * *'
  workflow_dispatch: # Permite rodar manualmente a qualquer momento

jobs:
  executar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python no Servidor
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install ccxt xgboost pandas numpy

      - name: Executar Varredura e Negociação Automática
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
        run: |
          python bot_top20.py
