name: Executar Bot Crypto IA

on:
  schedule:
    # Roda automaticamente no minuto 5 de cada hora
    - cron: '5 * * * *'
  workflow_dispatch: # Permite rodar manualmente pelo botão

jobs:
  executar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python no Servidor
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install ccxt xgboost pandas numpy

      - name: Listar arquivos (Debug)
        run: ls -la

      - name: Executar Varredura
        run: |
          python bot_top20.py
