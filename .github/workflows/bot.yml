name: Executar Bot Crypto IA

on:
  schedule:
    # Roda automaticamente a cada 1 hora (no minuto 5 de cada hora)
    - cron: '5 * * * *'
  workflow_dispatch: # Permite rodar manualmente clicando em um botão a qualquer momento

jobs:
  executar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar Python no Servidor
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install ccxt xgboost pandas numpy

      - name: Executar Varredura
        run: |
          python bot_top20.py
